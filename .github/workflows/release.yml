name: Release

# Manually triggered: enter a version (e.g. "0.2.0"), and this workflow
# builds the packages, creates the `vX.Y.Z` tag, and publishes a GitHub
# release whose notes are the commits since the previous tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev

      # gtk4-layer-shell isn't packaged on Ubuntu 24.04 (ubuntu-latest), so
      # build it from source for the wlr-layer-shell pinning backend.
      - name: Build and install gtk4-layer-shell
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell
          cd gtk4-layer-shell
          meson setup build -Dvapi=false -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Bump version
        run: |
          sed -i 's/^version = .*/version = "${{ github.event.inputs.version }}"/' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build Debian package
        run: cargo deb

      - name: Build RPM package
        run: cargo generate-rpm

      - name: Generate release notes from commits
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "${PREV_TAG}..HEAD" > release-notes.md
          else
            git log --pretty=format:'- %s' > release-notes.md
          fi

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Pinlet v${{ github.event.inputs.version }}
          body_path: release-notes.md
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
