[package]
name = "pinlet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pinlet — native sticky notes for Linux desktops"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
glib = "0.20"
gtk4 = "0.9"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ksni = { version = "0.3.6", features = ["blocking"] }
notify-rust = "4.17.0"
