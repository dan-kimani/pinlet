[package]
name = "pinlet"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Pinlet — native sticky notes for Linux desktops"
license = "MIT"
repository = "https://github.com/dan-kimani/pinlet"

[dependencies]
argon2 = "0.6.0"
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
async-io = "2.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-lite = "2.6.1"
glib = "0.20"
gtk4 = "0.9"
gtk4-layer-shell = "0.5.0"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
notify-rust = "4.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
gdk4-x11 = "0.9"
x11rb = { version = "0.14.0", default-features = false }
gdk4-x11-sys = "0.10"
pulldown-cmark = "0.13.4"

[package.metadata.deb]
maintainer = "Daniel Kimani <dankim761@gmail.com>"
copyright = "2026, Daniel Kimani"
depends = "libgtk-4-1 (>= 4.10), libadwaita-1-0 (>= 1.4), libgtk4-layer-shell0, git"
section = "utility"
priority = "optional"
maintainer-scripts = "debian/"
assets = [
    ["target/release/pinlet", "usr/bin/pinlet", "755"],
    ["assets/org.pinlet.Pinlet.desktop", "usr/share/applications/org.pinlet.Pinlet.desktop", "644"],
    ["assets/org.pinlet.Pinlet.svg", "usr/share/icons/hicolor/scalable/apps/org.pinlet.Pinlet.svg", "644"],
    ["assets/org.pinlet.Pinlet.metainfo.xml", "usr/share/metainfo/org.pinlet.Pinlet.metainfo.xml", "644"],
]
extended-description = """\
Pinlet — native sticky notes for Linux desktops.

Notes are plain Markdown files inside a git repository you own, with
reminders, checklists, desktop pinning, and git-based cross-machine
syncing."""

# RPM packaging (cargo generate-rpm). Shared-library deps (gtk4, libadwaita)
# are auto-detected from the binary; `git` is a command, so it's listed
# explicitly. Reuses the .deb postinst for install-time setup.
[package.metadata.generate-rpm]
summary = "Native sticky notes for the Linux desktop"
post_install_script = "debian/postinst"

[package.metadata.generate-rpm.requires]
git = ""
gtk4-layer-shell = ""

[[package.metadata.generate-rpm.assets]]
source = "target/release/pinlet"
dest = "/usr/bin/pinlet"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "assets/org.pinlet.Pinlet.desktop"
dest = "/usr/share/applications/org.pinlet.Pinlet.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "assets/org.pinlet.Pinlet.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/org.pinlet.Pinlet.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "assets/org.pinlet.Pinlet.metainfo.xml"
dest = "/usr/share/metainfo/org.pinlet.Pinlet.metainfo.xml"
mode = "644"
